name: Build Android APK (Antares VPN)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Déclenchement manuel en 1 clic depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    name: Build Antares VPN Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Cloner le dépôt
        uses: actions/checkout@v4

      - name: 2. Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configurer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Configurer Java 21 (JDK Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Configurer le cache Gradle officiel
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: 6. Configurer Android SDK 36 & Licences
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" 2>/dev/null || true

      - name: 7. Installer les dépendances du projet
        run: bun install

      - name: 8. Compiler l'application Web Vite
        run: bun run build

      - name: 9. Synchroniser avec Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initialisation du dossier android..."
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: 10. Droits d'exécution sur gradlew
        run: chmod +x android/gradlew

      - name: 11. Compiler l'APK Android (Debug)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 12. Téléverser l'APK (Artefact GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Antares-VPN-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 13. Publier une Release GitHub avec l'APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.4.0-${{ github.run_number }}
          name: Antares VPN v3.4.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 Antares VPN — APK Android Prêt à l'installation
            - **Package ID** : `com.antares.vpn`
            - **Version** : 3.4.0-neon (Build ${{ github.run_number }})
            - **Moteur** : VLESS-Reality & Hysteria 2 / WireGuard Native TUN
            
            Téléchargez le fichier `app-debug.apk` ci-dessous pour installer l'application sur votre smartphone Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
